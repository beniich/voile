name = "voile-web"
pages_build_output_dir = "dist"

# Configuration de compatibilité pour les Edge Functions (Workers)
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Variables publiques injectées dans la PWA (fallback si non fournies au build)
VITE_APP_VERSION = "1.0.0"
VITE_SENTRY_ENVIRONMENT = "production"
