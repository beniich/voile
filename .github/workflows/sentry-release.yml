name: Sentry Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  release-web:
    name: Release Web to Sentry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: packages/web
        run: pnpm build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Upload source maps to Sentry
        if: env.SENTRY_RELEASE != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: voile-web
          SENTRY_RELEASE: ${{ github.ref_name }}
        run: |
          cd packages/web
          npx @sentry/cli releases new "$SENTRY_RELEASE"
          npx @sentry/cli releases files "$SENTRY_RELEASE" upload-sourcemaps ./dist
          npx @sentry/cli releases finalize "$SENTRY_RELEASE"

  release-android:
    name: Release Android to Sentry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/android/**/*.gradle*') }}

      - name: Build Android release
        working-directory: packages/android
        run: ./gradlew assembleRelease
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: voile-android
          SENTRY_RELEASE: ${{ github.ref_name }}
          SENTRY_ENVIRONMENT: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: packages/android/app/build/outputs/apk/release/*.apk
